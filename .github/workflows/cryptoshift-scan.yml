# CryptoShift Scan — CBOM ingestion, AST linking, enrichment, artifact upload

name: cryptoshift-scan

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly scan at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      cbom_path:
        description: "Path to CBOM file (relative to repo root)"
        required: false
        default: "demo/cbom.json"
      target_repo_path:
        description: "Path to target Java repository"
        required: false
        default: "demo/target-repo"

concurrency:
  group: scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write  # comment only

jobs:
  scan-and-enrich:
    name: Scan & Enrich
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout CryptoShift
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.10"
          cache: pip

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00  # v4.7.1
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Install CryptoShift
        run: pip install -e ".[dev]"

      - name: Build Java helper
        run: cd java_helper && mvn clean compile -q

      - name: Determine CBOM path
        id: cbom
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "path=${{ inputs.cbom_path }}" >> $GITHUB_OUTPUT
          else
            echo "path=demo/cbom.json" >> $GITHUB_OUTPUT
          fi

      - name: Run cryptoshift scan
        run: |
          cryptoshift scan \
            --cbom "${{ steps.cbom.outputs.path }}" \
            --artifacts-dir artifacts/ \
            --json \
          || true  # Exit code 1 = not yet implemented; will be removed after Phase 1

      - name: Run cryptoshift enrich
        run: |
          cryptoshift enrich \
            --artifacts-dir artifacts/ \
            --json \
          || true  # Exit code 1 = not yet implemented; will be removed after Phase 2

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: scan-artifacts-${{ github.sha }}
          path: |
            artifacts/scan.json
            artifacts/enriched_cbom.json
          retention-days: 30

      - name: Post PR comment with risk summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const fs = require('fs');
            let summary = '## 🔐 CryptoShift Scan Summary\n\n';

            // Try to read enriched CBOM for risk counts
            try {
              const enriched = JSON.parse(fs.readFileSync('artifacts/enriched_cbom.json', 'utf8'));
              const findings = Array.isArray(enriched) ? enriched : [enriched];
              const high = findings.filter(f => f.risk?.score >= 7).length;
              const medium = findings.filter(f => f.risk?.score >= 4 && f.risk?.score < 7).length;
              const low = findings.filter(f => f.risk?.score < 4).length;

              summary += `| Risk Tier | Count |\n|---|---|\n`;
              summary += `| 🔴 High | ${high} |\n`;
              summary += `| 🟡 Medium | ${medium} |\n`;
              summary += `| 🟢 Low | ${low} |\n`;
              summary += `\n**Total findings:** ${findings.length}\n`;
            } catch (e) {
              summary += '> ⚠️ Scan artifacts not yet available (engine not implemented).\n';
              summary += '> This workflow will produce real results after Phase 1 & 2.\n';
            }

            summary += '\n---\n*Generated by CryptoShift. Requires human review.*';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔐 CryptoShift Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "artifacts/enriched_cbom.json" ]; then
            echo "✅ Scan and enrichment completed." >> $GITHUB_STEP_SUMMARY
            echo "Artifacts uploaded for review." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Engine not yet implemented. Skeleton run completed." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
