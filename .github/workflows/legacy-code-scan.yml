# Legacy Cryptographic Code Database Scanner & GitHub Code Scanning Workflow
# Scans legacy C/C++ crypto usages, records into SQLite database, and publishes SARIF alerts.

name: legacy-code-scan

on:
  push:
    branches: [main, develop]
    paths:
      - "demo/legacy_code/**"
      - "cryptoshift/parsers/c/**"
      - "cryptoshift/legacy_db/**"
      - ".github/workflows/legacy-code-scan.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "demo/legacy_code/**"
      - "cryptoshift/parsers/c/**"
      - "cryptoshift/legacy_db/**"
  workflow_dispatch:
    inputs:
      target_dir:
        description: "Path to legacy codebase to scan"
        required: false
        default: "demo/legacy_code"
      repo_name:
        description: "Repository identifier"
        required: false
        default: "legacy-codebase"

permissions:
  contents: read
  security-events: write

jobs:
  scan-legacy-code:
    name: Scan Legacy Cryptography & Update DB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.10"
          cache: pip

      - name: Install CryptoShift
        run: pip install -e ".[dev]"

      - name: Run legacy crypto scanner & update database
        id: scan
        run: |
          TARGET="${{ inputs.target_dir || 'demo/legacy_code' }}"
          REPO="${{ inputs.repo_name || github.repository || 'legacy-code' }}"
          
          echo "Scanning target: $TARGET for repo: $REPO"
          python -m cryptoshift.cli.main db scan "$TARGET" \
            --repo "$REPO" \
            --db legacy_crypto.db \
            --sarif results.sarif \
            --cbom cbom.json

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
          category: cryptoshift-legacy-scanner
        continue-on-error: true

      - name: Upload legacy database and reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: legacy-crypto-database
          path: |
            legacy_crypto.db
            results.sarif
            cbom.json
          retention-days: 30

      - name: Generate GitHub Job Summary
        if: always()
        run: |
          python -c "
          import json, os
          from pathlib import Path
          from cryptoshift.legacy_db import CryptoDatabase

          db = CryptoDatabase('legacy_crypto.db')
          summary = db.get_summary()

          markdown = [
              '## 🛡️ CryptoShift Legacy Code Database Scan Summary',
              f'**Total Findings:** {summary.get(\"total_findings\", 0)} | **Files Scanned:** {summary.get(\"total_files\", 0)}',
              '',
              '### Findings by Algorithm',
              '| Algorithm | Count |',
              '|---|---|',
          ]
          for algo, count in summary.get('by_algorithm', {}).items():
              markdown.append(f'| {algo} | {count} |')

          markdown.extend([
              '',
              '### Findings by Severity',
              '| Severity | Count |',
              '|---|---|',
          ])
          for sev, count in summary.get('by_severity', {}).items():
              markdown.append(f'| {sev} | {count} |')

          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as f:
                  f.write('\n'.join(markdown) + '\n')
          "
