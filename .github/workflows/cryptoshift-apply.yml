# CryptoShift Apply — Transform, Verify, and PR creation
# Triggered by workflow_dispatch or decision file changes.
# Uses a GitHub Environment with required reviewers as an additional approval gate.

name: cryptoshift-apply

on:
  workflow_dispatch:
    inputs:
      finding_ids:
        description: "Comma-separated finding IDs to process"
        required: true
      scan_run_id:
        description: "Run ID of the scan workflow to download artifacts from"
        required: false
  push:
    branches: [main, develop]
    paths:
      - "artifacts/decisions/*.json"

concurrency:
  group: apply-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write       # branch push
  pull-requests: write  # PR creation (no merge)

# NOTE: PRs created with the default GITHUB_TOKEN do not trigger other
# workflows. To make required status checks run on generated PRs, use a
# GitHub App installation token or PAT. See docs/ci-setup.md for details.

jobs:
  transform-and-verify:
    name: Transform & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cryptoshift-apply  # Requires reviewer approval in GitHub Environment settings
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.10"
          cache: pip

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00  # v4.7.1
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Install CryptoShift
        run: pip install -e ".[dev]"

      - name: Build Java helper
        run: cd java_helper && mvn clean compile -q

      # Download scan artifacts from a previous scan run
      - name: Download scan artifacts
        if: github.event.inputs.scan_run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: scan-artifacts-${{ github.sha }}
          path: artifacts/
        continue-on-error: true

      - name: Determine finding IDs
        id: findings
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ids=${{ inputs.finding_ids }}" >> $GITHUB_OUTPUT
          else
            # Extract finding IDs from changed decision files
            CHANGED=$(git diff --name-only HEAD~1 -- artifacts/decisions/ 2>/dev/null | \
                      sed 's|artifacts/decisions/||;s|\.json||' | \
                      tr '\n' ',' | sed 's/,$//')
            echo "ids=${CHANGED:-none}" >> $GITHUB_OUTPUT
          fi

      - name: Validate decisions exist
        run: |
          IFS=',' read -ra IDS <<< "${{ steps.findings.outputs.ids }}"
          for id in "${IDS[@]}"; do
            DECISION_FILE="artifacts/decisions/${id}.json"
            if [ -f "$DECISION_FILE" ]; then
              DECISION=$(python -c "import json; d=json.load(open('$DECISION_FILE')); print(d.get('decision',''))")
              echo "Finding $id: decision=$DECISION"
              if [ "$DECISION" != "approved" ]; then
                echo "::error::Finding $id has decision '$DECISION', not 'approved'. Skipping."
              fi
            else
              echo "::warning::No decision file for $id"
            fi
          done

      - name: Run cryptoshift transform
        run: |
          cryptoshift transform \
            --finding-ids "${{ steps.findings.outputs.ids }}" \
            --artifacts-dir artifacts/ \
            --json \
          || EXIT_CODE=$?
          if [ "${EXIT_CODE:-0}" -eq 3 ]; then
            echo "::warning::Some findings need human input (exit code 3)"
          elif [ "${EXIT_CODE:-0}" -ne 0 ] && [ "${EXIT_CODE:-0}" -ne 1 ]; then
            exit ${EXIT_CODE}
          fi

      - name: Run cryptoshift verify
        id: verify
        run: |
          cryptoshift verify \
            --finding-ids "${{ steps.findings.outputs.ids }}" \
            --artifacts-dir artifacts/ \
            --json \
          || EXIT_CODE=$?
          echo "exit_code=${EXIT_CODE:-0}" >> $GITHUB_OUTPUT
          # Exit code 2 = verification failed — fail the job, no PR
          if [ "${EXIT_CODE:-0}" -eq 2 ]; then
            echo "::error::Verification failed (Track A or Track B). No PR will be created."
            exit 2
          fi

      - name: Upload candidate artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: apply-artifacts-${{ github.sha }}
          path: |
            artifacts/candidates/
            artifacts/verification_report.json
            artifacts/audit/
          retention-days: 90

      - name: Create PRs for approved findings
        if: steps.verify.outputs.exit_code == '0'
        run: |
          cryptoshift pr \
            --finding-ids "${{ steps.findings.outputs.ids }}" \
            --artifacts-dir artifacts/ \
            --json \
          || EXIT_CODE=$?
          if [ "${EXIT_CODE:-0}" -eq 4 ]; then
            echo "::warning::Some findings missing approval (exit code 4)"
          elif [ "${EXIT_CODE:-0}" -ne 0 ] && [ "${EXIT_CODE:-0}" -ne 1 ]; then
            exit ${EXIT_CODE}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔐 CryptoShift Apply Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Finding IDs:** \`${{ steps.findings.outputs.ids }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Verify exit code:** \`${{ steps.verify.outputs.exit_code }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.verify.outputs.exit_code }}" = "0" ]; then
            echo "✅ Verification passed. PRs created for approved findings." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.verify.outputs.exit_code }}" = "2" ]; then
            echo "❌ Verification failed. No PRs created." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Engine not yet implemented. Skeleton run completed." >> $GITHUB_STEP_SUMMARY
          fi
