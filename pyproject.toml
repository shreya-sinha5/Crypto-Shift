[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptoshift"
version = "0.1.0"
description = "Automated Post-Quantum Cryptographic Migration Engine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "CryptoShift Team" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]

dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.5.0",
    "jsonschema>=4.20.0",
    "PyGithub>=2.1.0",
    "anthropic>=0.39.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.5.0",
    "black>=24.0.0",
    "pre-commit>=3.5.0",
    "mypy>=1.8.0",
]
dashboard = [
    "streamlit>=1.30.0",
]

[project.scripts]
cryptoshift = "cryptoshift.cli.main:app"

[tool.setuptools.packages.find]
include = ["cryptoshift*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
]
ignore = ["S101", "B008", "S608"]  # allow assert in tests, allow typer.Option, allow internal SQL assembly

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "golden: Golden-file tests",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
follow_imports = "silent"
